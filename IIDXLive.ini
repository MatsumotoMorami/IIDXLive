; IIDXLive 实时音画桥接。修改后重启游戏。
; 在启动器额外 DLL 中加入 IIDXLive.dll；OBS 添加“IIDX 游戏音画（原生音频）”。
[Live]
; 1=启用音频桥接；0=禁用。不改变游戏 ASIO 输出方式。
Enabled=1
; 1=让 OBS 的 D3D9 捕获只读取主屏后台缓冲区（TDJ 双屏推荐，默认）。
; 0=关闭此兼容处理，恢复 OBS 默认读取当前渲染目标的行为，可能抓到副屏。
; 只改 OBS 的取图请求，不修改游戏自身的渲染目标。修改后重启游戏。
MainScreenOnly=1
; 原生音频分流点的采样率：44100（默认）或 48000。
; 这不是 OBS 输出采样率，也不是录像帧率。当前按游戏原生 44100 Hz 配置。
; 仅在确认游戏内部音频采样率改变时修改，否则会导致变调和不同步。
SampleRate=44100

; 画面分辨率、帧率、编码和推流地址在 OBS 中设置，建议先用 1920x1080 / 60 FPS。
; 本插件没有直播地址和密钥，不会自行联网推流。
